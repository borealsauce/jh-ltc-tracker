<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>JH LTC Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#262626;--gold:#d4af37;--txt:#e5e5e5;--muted:#a3a3a3;--red:#ef4444;--green:#22c55e;--yel:#facc15}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px Inter,system-ui,sans-serif}
h1,h2{font-family:Oswald,sans-serif;letter-spacing:.05em;color:var(--gold);margin:0}h2{font-size:19px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px 40px}.top{border-bottom:1px solid var(--line);padding:18px 0;margin-bottom:16px;background:#0f0f0f}
.muted{color:var(--muted);font-size:12px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;transition:.2s}.card:hover{border-color:var(--gold);box-shadow:0 0 18px rgba(212,175,55,.18)}
.card .l{font:700 11px Inter;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.card .v{font:700 24px Oswald;margin-top:4px}.card .s{font-size:12px;color:var(--muted)}
.big .v{font-size:40px}.big{border-color:var(--gold)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line)}th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{position:relative;background:#1c1c1c;color:var(--gold);cursor:pointer;user-select:none}td:first-child,th:first-child{text-align:left}td.t,th.t{text-align:left}
.neg{color:var(--red)}.pos{color:var(--green)}.scroll{overflow-x:auto}tr.y td{background:rgba(250,204,21,.12)}tr.r td{background:rgba(239,68,68,.13)}
.sub td{background:#1f1a0c;color:var(--gold);font-weight:700;text-align:left}.tag{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700}.tag.y{background:var(--yel);color:#000}.tag.r{background:var(--red);color:#fff}.tag.g{background:#333}.tag.jh{background:var(--gold);color:#000}
section{background:#0f0f0f;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.h{cursor:grab;color:var(--muted);font-size:18px}section.drag{opacity:.4}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pill{border:1px solid var(--line);background:var(--card);color:var(--txt);border-radius:99px;padding:7px 16px;font:600 13px Inter;cursor:pointer}.pill.on{background:var(--gold);color:#000;border-color:var(--gold)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;height:300px;margin-bottom:12px}button.rst{float:right;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;cursor:pointer}
.rz{position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize}.rz:hover{background:var(--gold)}table.fx{table-layout:fixed}td{overflow:hidden;text-overflow:ellipsis}.plbl{align-self:center;font:700 11px Inter;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);min-width:52px}</style></head><body>
<div class="top"><div class="wrap" style="padding-bottom:0"><button class="rst" onclick="localStorage.removeItem('jhorder');location.reload()">Reset layout</button><h1>JH LTC TRACKER</h1><div class="muted" id="meta"></div>
<div class="pills" id="pills"></div><div class="pills" id="vpills"></div></div></div>
<div class="wrap"><section id="vend"></section></div>
<div class="wrap" id="secs"></div>
<script>
const $=s=>document.querySelector(s),f=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),
cl=n=>n<0?'neg':n>0?'pos':'',sg=n=>`<span class="${cl(n)}">${f(n)}</span>`;let D,YR='All',ch;const VFIXED=['BrightStar','FirstLight Home Care','Home RN','LifeWorx'];
const tierTag=t=>t=='30+ overdue'?'<span class="tag r">30+ overdue</span>':t=='2 wks overdue'?'<span class="tag y">2 wks overdue</span>':'<span class="tag g">within 14 days</span>';
const inY=d=>YR=='All'||d.startsWith(YR);const S2=(a,k)=>a.reduce((s,x)=>s+x[k],0);const S=a=>a.reduce((s,x)=>s+x.amount,0);
const planFor=ym=>ym>='2026-11'?10133:9867;
const money0=n=>'$'+Number(n).toLocaleString('en-US');
const planLbl=rows=>{const ps=[...new Set((rows||[]).map(b=>b.plan||planFor(b.month)))].sort((a,b)=>a-b);if(!ps.length)return '—';if(ps.length===1)return money0(ps[0])+'/mo';return money0(9867)+'/mo through Oct 2026, then '+money0(10133)+'/mo';};
function tbl(id,cols,rows,rowcls){return `<div class="scroll"><table id="${id}"><thead><tr>${cols.map((c,i)=>`<th class="${c[2]||''}" data-i="${i}">${c[0]}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>r.sub?`<tr class="sub"><td colspan="${cols.length}">${r.sub}</td></tr>`:`<tr class="${rowcls?rowcls(r):''}">${cols.map(c=>`<td class="${c[2]||''}" data-v="${typeof c[1](r,1)=='number'?c[1](r,1):String(c[1](r,1)).replace(/"/g,'')}">${c[1](r)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function render(){
 const um=D.unmatched.filter(p=>inY(p.date)),mt=D.matched.filter(p=>inY(p.date)),ins=D.ins.filter(i=>inY(i.date)),jh=ins.filter(i=>i.jh),pays=um.concat(mt);
 const T=t=>um.filter(p=>p.tier==t),jhT=S(jh),care=S(pays),owed=S(um);
 const sec={};const bm=D.by_month.filter(b=>inY(b.month));const EXP=bm.reduce((s,b)=>s+b.exp,0),JHM=bm.reduce((s,b)=>s+b.jh,0),OWC=Math.max(0,EXP-JHM);const OV=bm.reduce((s,b)=>s+b.over,0);
 sec.owed=`<h2><span class="h">≡</span>STILL OWED BY JH</h2><div class="cards">
  <div class="card big"><div class="l">Still owed by JH</div><div class="v neg">${f(OWC)}</div><div class="s">Care paid capped at ${planLbl(bm)} (${f(EXP)}) − JH received (${f(JHM)}) · ${f(owed)} in ${um.length} unmatched payments before cap</div></div>
  <div class="card"><div class="l">Within 14 days</div><div class="v">${f(S(T('within 14 days')))}</div><div class="s">${T('within 14 days').length} payments · not overdue yet</div></div>
  <div class="card" style="border-color:var(--yel)"><div class="l">2 wks overdue (14–29d)</div><div class="v neg">${f(S(T('2 wks overdue')))}</div><div class="s">${T('2 wks overdue').length} payments</div></div>
  <div class="card" style="border-color:var(--red)"><div class="l">30+ days overdue</div><div class="v neg">${f(S(T('30+ overdue')))}</div><div class="s">${T('30+ overdue').length} payments</div></div></div>
  <div class="cards" style="margin-top:12px">${VFIXED.map(v=>{const a=um.filter(p=>p.vendor==v);return `<div class="card"><div class="l">${v}</div><div class="v neg">${f(S(a))}</div><div class="s">${a.length} unpaid · <span style="color:var(--yel)">${f(S(a.filter(p=>p.tier=='2 wks overdue')))}</span> 2wk · <span class="neg">${f(S(a.filter(p=>p.tier=='30+ overdue')))}</span> 30+</div></div>`}).join('')}</div>`;
 sec.sum=`<h2><span class="h">≡</span>SUMMARY</h2><div class="cards">
  <div class="card"><div class="l">JH received</div><div class="v pos">${f(jhT)}</div><div class="s">${jh.length} deposits</div></div>
  <div class="card"><div class="l">Care expenses</div><div class="v neg">${f(-care)}</div><div class="s">${pays.length} payments (Synovus + Citi)</div></div>
  <div class="card"><div class="l">Net gap / shortage</div><div class="v">${sg(jhT-care)}</div><div class="s">JH received − care paid</div></div>

  <div class="card"><div class="l">Matched to JH</div><div class="v pos">${f(S(mt))}</div><div class="s">${mt.length} payments</div></div>
  <div class="card"><div class="l">JH deposits not matched</div><div class="v">${f(S(jh.filter(j=>!j.matched)))}</div><div class="s">JH paid amounts that don't equal one payment (partial / combined)</div></div></div>`;
 sec.month=`<h2><span class="h">≡</span>BY MONTH</h2><div class="chart"><canvas id="cm"></canvas></div>`+tbl('tm',[['Month',r=>r.month,'t'],['JH received',(r,v)=>v?r.jh:sg(r.jh)],['Care paid',(r,v)=>v?-r.care:sg(-r.care)],['Net',(r,v)=>v?r.net:sg(r.net)],['Over Plan',(r,v)=>v?-r.over:(r.over>0?sg(-r.over):'—')],['Expected (capped)',(r,v)=>v?r.exp:sg(r.exp)],['Gap owed',(r,v)=>v?-r.gap:sg(-r.gap)]],bm)+`<table style="margin-top:-1px"><tr style="font-weight:700"><td class="t">TOTAL</td><td>${sg(S2(bm,'jh'))}</td><td>${sg(-S2(bm,'care'))}</td><td>${sg(S2(bm,'net'))}</td><td>${sg(-OV)}</td><td>${sg(EXP)}</td><td>${sg(-(EXP-JHM))}</td></tr></table>`;
 const vs=[...new Set([...VFIXED,...pays.map(p=>p.vendor)])].map(v=>{const a=pays.filter(p=>p.vendor==v),r=mt.filter(p=>p.vendor==v),o=um.filter(p=>p.vendor==v);return{v,n:a.length,paid:S(a),re:S(r),ow:S(o)}});
 sec.vendor=`<h2><span class="h">≡</span>BY VENDOR</h2>`+tbl('tv',[['Vendor',r=>r.v,'t'],['Payments',r=>r.n],['Paid',(r,v)=>v?-r.paid:sg(-r.paid)],['Gap / still owed',(r,v)=>v?-r.ow:sg(-r.ow)],['Over Plan',(r,v)=>'']],vs)+`<table style="margin-top:-1px"><tr style="font-weight:700"><td class="t">TOTAL</td><td>${pays.length}</td><td>${sg(-care)}</td><td>${sg(-owed)}</td><td>${sg(-OV)} over plan</td></tr></table>`;
 const VPAID=['FirstLight Home Care','Home RN','LifeWorx','BrightStar'];const vp=VPAID.map(name=>vs.find(x=>x.v==name)).filter(Boolean).concat(vs.filter(x=>!VPAID.includes(x.v)));
 sec.paid=`<h2><span class="h">≡</span>PAID TO CAREGIVER VENDORS</h2><div class="cards"><div class="card big"><div class="l">Total paid to care vendors</div><div class="v neg">${f(-care)}</div><div class="s">${pays.length} payments · Synovus + Citi</div></div>${vp.map(v=>`<div class="card"><div class="l">${v.v}</div><div class="v neg">${f(-v.paid)}</div><div class="s">${v.n} payments · ${care?(v.paid/care*100).toFixed(1):0}% of total</div></div>`).join('')}</div>`;
 const g=[];[...new Set(um.map(p=>p.vendor))].sort().forEach(v=>{const a=um.filter(p=>p.vendor==v).sort((x,y)=>y.date.localeCompare(x.date));g.push({sub:`${v} — ${f(S(a))} (${a.length})`},...a)});
 sec.chase=`<h2><span class="h">≡</span>UNMATCHED PAYMENTS — CHASE LIST</h2><div class="muted" style="margin-bottom:8px">JH expected within 2 weeks. Yellow = 2 wks overdue (14–29 days) · Red = 30+ days overdue. Match rule: same amount ±$0.10, JH posted 7 days before to 35 days after.</div>`+tbl('tc',[['Date',r=>r.date,'t'],['Vendor',r=>r.vendor,'t'],['Source',r=>r.src,'t'],['Amount',(r,v)=>v?-r.amount:sg(-r.amount)],['Days unpaid',r=>r.days],['Status',(r,v)=>v?r.tier:tierTag(r.tier),'t']],g,r=>r.tier=='30+ overdue'?'r':r.tier=='2 wks overdue'?'y':'');
 const bs={};ins.forEach(i=>{bs[i.source]=bs[i.source]||{s:i.source,n:0,a:0};bs[i.source].n++;bs[i.source].a+=i.amount});
 sec.ins=`<h2><span class="h">≡</span>PAYMENTS IN (ALL SYNOVUS DEPOSITS)</h2><div class="pills" id="inf"><button class="pill on" data-f="all">All</button><button class="pill" data-f="jh">John Hancock only</button><button class="pill" data-f="other">Other</button></div>`+
  tbl('tbs',[['Source',r=>r.s,'t'],['Count',r=>r.n],['Total',(r,v)=>v?r.a:sg(r.a)]],Object.values(bs).sort((a,b)=>b.a-a.a))+'<div style="height:12px"></div>'+
  tbl('ti',[['Date',r=>r.date,'t'],['Source',(r,v)=>v?r.source:(r.jh?'<span class="tag jh">JH</span> ':'')+r.source,'t'],['Amount',(r,v)=>v?r.amount:sg(r.amount)],['Matched to',r=>r.jh?(r.matched||'— not matched'):'','t']],ins,r=>r.jh?'jh':'oth');
 const g2=[];[...new Set(mt.map(p=>p.vendor))].sort().forEach(v=>{const a=mt.filter(p=>p.vendor==v).sort((x,y)=>y.date.localeCompare(x.date));g2.push({sub:`${v} — ${f(S(a))} (${a.length})`},...a)});
 sec.matched=`<h2><span class="h">≡</span>MATCHED PAYMENTS (REIMBURSED)</h2>`+tbl('tmt',[['Date',r=>r.date,'t'],['Vendor',r=>r.vendor,'t'],['Source',r=>r.src,'t'],['Amount',(r,v)=>v?-r.amount:sg(-r.amount)],['JH deposit',r=>r.match,'t'],['Days to JH',r=>r.lag]],g2);
 const def=['owed','sum','paid','month','vendor','chase','ins'];let ord=JSON.parse(localStorage.getItem('jhorder')||'null');if(!ord||ord.length!=def.length)ord=def;
 $('#secs').innerHTML=ord.map(k=>`<section draggable="false" data-k="${k}">${sec[k]}</section>`).join('');
 if(window.Chart){ch&&ch.destroy();ch=new Chart($('#cm'),{type:'bar',data:{labels:bm.map(b=>b.month),datasets:[{label:'JH received',data:bm.map(b=>b.jh),backgroundColor:'#22c55e'},{label:'Care paid',data:bm.map(b=>b.care),backgroundColor:'#ef4444'},{type:'line',label:'Net',data:bm.map(b=>b.net),borderColor:'#d4af37',backgroundColor:'#d4af37'}]},options:{maintainAspectRatio:false,plugins:{legend:{labels:{color:'#e5e5e5'}}},scales:{x:{ticks:{color:'#a3a3a3'},grid:{color:'#262626'}},y:{ticks:{color:'#a3a3a3'},grid:{color:'#262626'}}}}})}
 wire()}
function wire(){
 document.querySelectorAll('#inf .pill').forEach(p=>p.onclick=()=>{document.querySelectorAll('#inf .pill').forEach(x=>x.classList.remove('on'));p.classList.add('on');const m=p.dataset.f;
  document.querySelectorAll('#ti tbody tr').forEach(r=>r.style.display=m=='all'||(m=='jh'&&r.classList.contains('jh'))||(m=='other'&&r.classList.contains('oth'))?'':'none')});
 let dr;document.querySelectorAll('section').forEach(s=>{const h=s.querySelector('.h');if(!h)return;h.onmousedown=()=>s.draggable=true;s.ondragstart=()=>{dr=s;s.classList.add('drag')};
  s.ondragend=()=>{s.classList.remove('drag');s.draggable=false;localStorage.setItem('jhorder',JSON.stringify([...document.querySelectorAll('#secs section')].map(x=>x.dataset.k)))};
  s.ondragover=e=>{e.preventDefault();if(dr&&dr!==s){const r=s.getBoundingClientRect();s.parentNode.insertBefore(dr,e.clientY<r.top+r.height/2?s:s.nextSibling)}}})}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{D=d;$('#meta').textContent=`Lynn Reichlyn · John Hancock LTC reimbursements vs care payments · Synovus checking ${d.range.synovus[0]} → ${d.range.synovus[1]} + Citi card care charges · updated ${d.generated}`;
 const ys=['All',...new Set(d.by_month.map(b=>b.month.slice(0,4)))];$('#pills').innerHTML='<span class="plbl">Year</span>'+ys.map(y=>`<button class="pill ${y==YR?'on':''}" data-y="${y}">${y}</button>`).join('');
 document.querySelectorAll('#pills .pill').forEach(p=>p.onclick=()=>{YR=p.dataset.y;document.querySelectorAll('#pills .pill').forEach(x=>x.classList.toggle('on',x==p));render();if(typeof VD!="undefined"&&VD)vrender();
  const s=$('#secs');if(s&&s.getBoundingClientRect().top>innerHeight*.45)s.scrollIntoView({behavior:'smooth',block:'start'})});render()});
</script><script>
let VD,VS='All';const VN=['All','Home RN','FirstLight','LifeWorx','BrightStar'];
function vSum(VS,YR){
 const empty={paid_n:0,paid:0,eob_n:0,eob:0,eob_last:null,un_n:0,un:0,od30_n:0,od30:0,od2_n:0,od2:0,in14_n:0,in14:0,jh_in:0,jh_posted:0,jh_pending:0,jh_n:0,jh_pending_n:0,gap_vs_paid:0,plan:null,months:0,cap:0,cap_detail:'—',eligible:0,all_paid:0};
 const by=VD.summary_by_year||{};
 const sy=by[YR]||(YR=='All'||YR=='2026'?VD.summary:null);
 if(!sy)return empty;
 return sy[VS]||(VS=='All'&&!by[YR]?sy:empty);
}
function vrender(){
 const s=vSum(VS,YR);
 const L=VD.payments.filter(p=>(YR=='All'||p.date.startsWith(YR))&&(VS=='All'||p.vendor==VS));
 const ylbl=YR=='All'?'ALL YEARS':(YR=='2026'?'2026 YTD':YR);
 const eobSub=s.eob_n?(s.eob_n+' EOBs · per EOBs through '+(s.eob_last||'—')+' · newer EOBs need the JH portal'):'No EOBs on file';
 const eob=`<div class="card"><div class="l">Paid per EOBs</div><div class="v ${s.eob?'pos':''}">${f(s.eob)}</div><div class="s">${eobSub}</div></div>`;
 const tag=t=>t=='Covered by EOB'?'<span class="tag jh">Covered by EOB</span>':t=='30+ overdue'?'<span class="tag r">30+ overdue</span>':t=='2–4 wks overdue'?'<span class="tag y">2–4 wks overdue</span>':'<span class="tag g">within 14 days</span>';
 const pendNote=s.jh_pending?` · incl. ${f(s.jh_pending)} pending (${s.jh_pending_n})`:'';
 const gap=s.gap_vs_paid;
 const gapLbl=gap>=0?`Gap vs paid: ${f(gap)}`:`JH ahead of paid: ${f(-gap)}`;
 const capBit=s.cap_detail?` (${s.cap_detail})`:(s.plan?` (${f(s.plan)}×${s.months} mo)`:'');
 const eobNote=s.eob_last?` (latest EOB ${s.eob_last})`:' (no EOBs on file)';
 $('#vend').innerHTML=`<h2>VENDOR VIEW — ${VS.toUpperCase()} · ${ylbl}</h2><div class="cards">
 <div class="card"><div class="l">Payments made</div><div class="v neg">${f(s.paid)}</div><div class="s">${s.paid_n} payments (Synovus + Citi) · ${ylbl}</div></div>
 <div class="card big"><div class="l">JH deposits received · ${YR=='All'?'ALL YEARS':YR}</div><div class="v pos">${f(s.jh_in)}</div><div class="s">${s.jh_n} Synovus deposits${pendNote}<br>${gapLbl}</div></div>
 <div class="card" style="border-color:var(--gold)"><div class="l">Still eligible to be paid · ${YR=='All'?'ALL YEARS':YR}</div><div class="v neg">${f(s.eligible)}</div><div class="s">Paid ${f(s.all_paid)} · Cap ${f(s.cap)}${capBit} · JH in ${f(s.jh_in)}</div></div>
 ${eob}
 <div class="card" style="border-color:var(--yel)"><div class="l">2–4 weeks</div><div class="v neg">${f(s.od2)}</div><div class="s">${s.od2_n} payments</div></div></div>
 <div class="muted" style="margin:8px 0">JH deposits &amp; eligible are portfolio totals (not per-vendor). Reimbursed column = JH EOBs only${eobNote}; EOB dollars applied to that vendor's oldest payments first (same year). As of ${VD.as_of}.</div>`+
 tbl('tvp',[['Date',r=>r.date,'t'],['Vendor',r=>r.vendor,'t'],['Source',r=>r.src,'t'],['Amount',(r,v)=>v?-r.amount:sg(-r.amount)],['Covered by EOB',(r,v)=>v?r.eob_cov:f(r.eob_cov)],['Still unpaid',(r,v)=>v?-r.open:sg(-r.open)],['Days',r=>r.days],['Status',(r,v)=>v?r.status:tag(r.status),'t']],L,r=>r.status=='30+ overdue'?'r':r.status=='2–4 wks overdue'?'y':'');rz()}
fetch('vendors.json?'+Date.now()).then(r=>r.json()).then(d=>{VD=d;$('#vpills').innerHTML='<span class="plbl">Vendor</span>'+VN.map(v=>`<button class="pill ${v==VS?'on':''}" data-v="${v}">${v}</button>`).join('');
 document.querySelectorAll('#vpills .pill').forEach(p=>p.onclick=()=>{VS=p.dataset.v;document.querySelectorAll('#vpills .pill').forEach(x=>x.classList.toggle('on',x==p));vrender()});vrender()});
function rz(){document.querySelectorAll('th').forEach(th=>{if(th.querySelector('.rz'))return;const g=document.createElement('span');g.className='rz';th.appendChild(g);
 g.addEventListener('click',e=>e.stopPropagation());g.addEventListener('mousedown',e=>{e.preventDefault();e.stopPropagation();const t=th.closest('table');
 if(!t.classList.contains('fx')){[...t.rows[0].cells].forEach(c=>c.style.width=c.offsetWidth+'px');t.style.width=t.offsetWidth+'px';t.classList.add('fx')}
 const x=e.clientX,w=th.offsetWidth,tw=t.offsetWidth;const mv=m=>{const nw=Math.max(40,w+m.clientX-x);th.style.width=nw+'px';t.style.width=(tw+nw-w)+'px'};
 const up=()=>{document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up)};document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up)})})}
new MutationObserver(()=>rz()).observe(document.body,{childList:true,subtree:true});
</script>

/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.

   keep their members: sorting happens within each group. Uses td[data-v] when present.

(function(){

    if(host.units){host.units.forEach(function(u){if(u.classList.contains('bxd-colu')!==on)u.classList.toggle('bxd-colu',on);});return;}
    if(host.classList.contains('bxd-col')!==on)host.classList.toggle('bxd-col',on);}
  var HSEL='h1,h2,h3,h4,h5,h6';
  function sigKids(el){var n=0;for(var i=0;i<el.children.length;i++){var c=el.children[i];if(/^(SCRIPT|STYLE|TEMPLATE|BR)$/.test(c.tagName)||c.classList.contains('bxd-h')||c.classList.contains('bxd-c'))continue;n++;}return n;}
  function hdr2(e){ // header for a free-standing table: h2-h6, or a header row holding one (no tables/lists inside)
    if(e.classList.contains('bxd-h')||!(e.textContent||'').trim())return null;
    if(/^H[2-6]$/.test(e.tagName))return e;
    if(/^(TABLE|UL|OL|SCRIPT|STYLE|CANVAS)$/.test(e.tagName)||e.querySelector('table,ul,ol,canvas'))return null;
    var hh=e.querySelector('h2,h3,h4,h5,h6');if(hh&&sigKids(e)<=4&&(e.textContent||'').length<200)return e;
    return null;
  }
  function boxA(t){ // (a) a styled box with its own header that holds the table -> fold the whole box
    for(var a=t.parentElement,n=0;a&&a!==document.body&&n<8;a=a.parentElement,n++){
      if(a.hasAttribute('data-nocollapse'))return null;
      if(a.hasAttribute('data-collapsible')||boxy(a)){var f=findHdr(a,t);
        if(f){var hs=a.querySelectorAll(HSEL),own=0;for(var i=0;i<hs.length;i++)if(!f.hdr.contains(hs[i])&&hs[i]!==f.hdr)own++;
          if(!own||a.hasAttribute('data-collapsible')){f.box=a;return f;}}
        return null;} // nearest styled box decides
    }
    return null;
  }
  function boxB(t){ // (b) table is its own box: nearest heading before it folds the table block
    var U=t;while(U.parentElement&&U.parentElement!==document.body&&sigKids(U.parentElement)===1)U=U.parentElement;
    for(var lv=0;lv<4&&U&&U!==document.body;lv++){
      for(var e=U.previousElementSibling;e;e=e.previousElementSibling){var h=hdr2(e);if(h)return {hdr:h,unit:U};
        if(e.matches(HSEL)||e.querySelector(HSEL))break;}
      var P=U.parentElement;if(!P||P===document.body||P.hasAttribute('data-nocollapse'))return null;
      var hs=P.querySelectorAll(HSEL),bad=false;for(var i=0;i<hs.length;i++)if(!U.contains(hs[i])&&!(hs[i].compareDocumentPosition(U)&4)){bad=true;break;} // heading after U inside P
      if(bad)return null;U=P;if(U.querySelector(HSEL))return null;
    }
    return null;
  }
  function collapseScan(){
    var seen={},boxes=[],heads=[],ts=document.querySelectorAll('table,ul,ol,[data-collapsible]');
    for(var i=0;i<ts.length;i++){var t=ts[i];
      if(t.closest('[data-nocollapse],.bxd-h,.bxd-c,#bxd-reset,nav,thead,tfoot,.bxd-colu'))continue;
      if(t.hasAttribute('data-collapsible')){for(var k=0;k<t.children.length;k++){var hh=isHdr(t.children[k]);if(hh){if(boxes.indexOf(t)<0){boxes.push(t);mk({host:t,hdr:hh,box:t},seen);}break;}}continue;}
      if(t.tagName==='TABLE'){if(t.rows.length<3||t.parentElement.closest('table'))continue;}
      else if(t.children.length<5||t.parentElement.closest('ul,ol,table'))continue;
      if(!t.getClientRects().length&&!t.closest('.bxd-col'))continue;
      if(inFixed(t))continue;
      var f=boxA(t);
      if(f){if(boxes.indexOf(f.box)<0){boxes.push(f.box);mk(f,seen);}continue;}
      if(t.closest('.bxd-col'))continue;
      var g=boxB(t);if(!g)continue;
      var hi=heads.indexOf(g.hdr);
      if(hi<0){heads.push(g.hdr);g.hdr.__bxdU=[g.unit];mk({hdr:g.hdr,units:g.hdr.__bxdU,box:g.hdr},seen);}
      else if(g.hdr.__bxdU.indexOf(g.unit)<0){g.hdr.__bxdU.push(g.unit);var c=g.hdr.querySelector('.bxd-c');if(c)tgl(c,c.__bxdHost,c.__bxdK,!!col[c.__bxdK]);}
    }
  }
  function mk(f,seen){
    var k=f.units?'h:'+clean(f.hdr.textContent):ikey(f.box);seen[k]=(seen[k]||0)+1;if(seen[k]>1)k+='~'+seen[k];
    var hd=f.hdr,tgt=/^H[1-6]$/.test(hd.tagName)?hd:(hd.querySelector(HSEL)||hd);
    if(!f.units&&!hd.classList.contains('bxd-hd'))hd.classList.add('bxd-hd');
    var h=null;for(var i=0;i<tgt.children.length;i++)if(tgt.children[i].classList.contains('bxd-c')){h=tgt.children[i];break;}
    if(!h){h=document.createElement('button');h.type='button';h.className='bxd-c';h.setAttribute('data-noboxdrag','');tgt.insertBefore(h,tgt.firstChild);}
    h.__bxdK=k;h.__bxdHost=f.units?{units:f.units}:f.host;tgl(h,h.__bxdHost,k,!!col[k]);
  }
  function storeCol(){try{if(Object.keys(col).length)localStorage.setItem(LC,JSON.stringify(col));else localStorage.removeItem(LC);}catch(e){}}
  function onTgl(e){var h=e.target.closest&&e.target.closest('.bxd-c');if(!h)return;e.preventDefault();e.stopPropagation();if(e.stopImmediatePropagation)e.stopImmediatePropagation();
    if(e.type!=='click')return;var k=h.__bxdK,host=h.__bxdHost;if(!k||!host)return;var on=!col[k];if(on)col[k]=1;else delete col[k];storeCol();
    if(!on)(host.units||[].slice.call(host.children)).forEach(function(u){u.classList.add('bxd-noanim');[].forEach.call(u.querySelectorAll('[class*=fx],[class*=anim],[class*=fade]'),function(x){x.classList.add('bxd-noanim');});});
    tgl(h,host,k,on);later();}
  document.addEventListener('click',onTgl,true);
  ['pointerdown','mousedown','touchstart','dblclick'].forEach(function(n){document.addEventListener(n,function(e){if(e.target.closest&&e.target.closest('.bxd-c'))e.stopPropagation();},{capture:true,passive:true});});
  window.boxcollapseAll=function(on){[].forEach.call(document.querySelectorAll('.bxd-c'),function(h){if(!h.__bxdK)return;if(on)col[h.__bxdK]=1;else delete col[h.__bxdK];tgl(h,h.__bxdHost,h.__bxdK,!!on);});storeCol();};
  function later(){clearTimeout(timer);timer=setTimeout(scan,250);}
  function store(){try{if(Object.keys(saved).length)localStorage.setItem(LS,JSON.stringify(saved));else localStorage.removeItem(LS);}catch(e){}showReset();}
  function showReset(){var b=document.getElementById('bxd-reset');
    if(!b&&document.body){b=document.createElement('button');b.id='bxd-reset';b.type='button';b.textContent='↺ Reset layout';b.setAttribute('data-noboxdrag','');
      b.title='Put every box back in its original spot';b.onclick=resetLayout;document.body.appendChild(b);}
    if(b){var v=Object.keys(saved).length?'block':'none';if(b.style.display!==v)b.style.display=v;}}
  function resetLayout(){
    var cs=containers();saved={};store();
    cs.forEach(function(c){var list=items(c);if(list.length<2)return;var ck=ckey(c);if(orig[ck])arrange(c,ck,list,keys(list),orig[ck]);});
  }
  window.boxdragReset=resetLayout;
  function swap(a,b){var m=document.createComment('bxd');a.parentNode.insertBefore(m,a);b.parentNode.insertBefore(a,b);m.parentNode.replaceChild(b,m);}

  // ---- dragging (pointer events: mouse, pen, touch) ----
  document.addEventListener('pointerdown',function(e){
    var h=e.target.closest&&e.target.closest('.bxd-h');if(!h||e.button>0)return;
    var it=h.parentElement,c=it&&it.__bxdC;if(!c)return;
    e.preventDefault();e.stopPropagation();
    try{h.setPointerCapture(e.pointerId);}catch(x){}
    dragging={h:h,it:it,c:c,id:e.pointerId,x0:e.clientX+scrollX,y0:e.clientY+scrollY,cx:e.clientX,cy:e.clientY,on:false,tgt:null,raf:0};
  },true);
  function edge(){ if(!dragging||!dragging.on)return;var d=dragging,v=0,H=innerHeight,M=Math.min(80,H*.12);
    if(d.cy>=M&&d.cy<=H-M)d.armed=true;if(d.armed){if(d.cy<M)v=-Math.ceil((M-d.cy)/4);else if(d.cy>H-M)v=Math.ceil((d.cy-(H-M))/4);}
    if(v){scrollBy(0,v);move(d.cx,d.cy);}d.raf=requestAnimationFrame(edge);}
  function move(x,y){var d=dragging;d.cx=x;d.cy=y;
    d.it.style.transform='translate('+(x+scrollX-d.x0)+'px,'+(y+scrollY-d.y0)+'px)';
    var el=document.elementFromPoint(x,y),t=null;
    for(var a=el;a&&a!==document.body;a=a.parentElement){if(a.__bxdC===d.c&&a!==d.it&&a.parentElement===d.c){t=a;break;}}
    if(t!==d.tgt){if(d.tgt)d.tgt.classList.remove('bxd-tgt');d.tgt=t;if(t)t.classList.add('bxd-tgt');}}
  document.addEventListener('pointermove',function(e){var d=dragging;if(!d||e.pointerId!==d.id)return;e.preventDefault();
    if(!d.on){if(Math.abs(e.clientX+scrollX-d.x0)+Math.abs(e.clientY+scrollY-d.y0)<5)return;
      d.on=true;d.it.classList.add('bxd-src');document.body.classList.add('bxd-on');d.raf=requestAnimationFrame(edge);}
    move(e.clientX,e.clientY);},{capture:true,passive:false});
  function end(e,cancel){var d=dragging;if(!d||e.pointerId!==d.id)return;dragging=null;cancelAnimationFrame(d.raf);
    d.it.classList.remove('bxd-src');d.it.style.transform='';document.body.classList.remove('bxd-on');
    if(d.tgt)d.tgt.classList.remove('bxd-tgt');
    if(d.on&&!cancel&&d.tgt&&d.tgt.parentElement===d.c&&d.it.parentElement===d.c){
      swap(d.it,d.tgt);var list=items(d.c);saved[d.c.__bxdKey||ckey(d.c)]=keys(list);store();}
    later();}
  document.addEventListener('pointerup',function(e){end(e,false);},true);
  document.addEventListener('pointercancel',function(e){end(e,true);},true);
  document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('.bxd-h')){e.preventDefault();e.stopPropagation();}},true);
  document.addEventListener('touchmove',function(e){if(dragging)e.preventDefault();},{passive:false});

  function start(){scan();new MutationObserver(function(ms){
      for(var i=0;i<ms.length;i++){var t=ms[i].target;if(t.id==='bxd-reset'||dragging)continue;var an=ms[i].addedNodes;if(!(t.classList&&(t.classList.contains('bxd-h')||t.classList.contains('bxd-c')))&&!(an.length===1&&(an[0].className==='bxd-h'||an[0].className==='bxd-c'))){later();return;}}
    }).observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['class','style','hidden']});
    addEventListener('resize',later);addEventListener('load',later);}
  if(document.body)start();else document.addEventListener('DOMContentLoaded',start);
})();

</script><!--BOXDRAG-END-->
